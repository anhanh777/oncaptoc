<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Luyện Toàn Diện TACN HTTT - Full 5 Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-surface: #131c31;
      --bg-card: #1b2640;
      --border-color: #2a3b61;
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #152238 0%, #0a0f1d 80%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e0f2fe 10%, #38bdf8 60%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: var(--text-muted); font-size: 0.98rem; }
    
    /* Top Test Selector Tabs */
    .test-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 9px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: var(--bg-card); color: #fff; }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }

    .test-content { display: none; animation: fadeIn 0.25s ease-in-out forwards; }
    .test-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Part Navigation Inside Test */
    .part-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .part-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .part-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .part-btn.active {
      background: var(--accent-blue);
      color: #0a0f1d;
      font-weight: 700;
      border-color: var(--accent-blue);
    }

    .part-section { display: none; }
    .part-section.active { display: block; }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 22px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Part 1: Table 2 Columns */
    .matching-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); }
    .matching-table { width: 100%; border-collapse: collapse; text-align: left; }
    .matching-table th {
      background: #101726;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }
    .matching-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      vertical-align: middle;
    }
    .matching-table tr:last-child td { border-bottom: none; }
    .matching-table tr:hover { background: rgba(27, 38, 64, 0.5); }
    .term-tag { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #fff; font-size: 1rem; }

    select.custom-select {
      background: #0a0f1d;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      width: 100%;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select.custom-select:focus { border-color: var(--accent-blue); }
    select.custom-select.is-correct { border-color: var(--success); background-color: var(--success-bg); color: #6ee7b7; }
    select.custom-select.is-wrong { border-color: var(--danger); background-color: var(--danger-bg); color: #fda4af; }

    /* Explanation Boxes */
    .exp-box {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #172236;
      border-left: 4px solid var(--accent-blue);
      display: none;
      font-size: 0.88rem;
    }
    .exp-box.show { display: block; }
    .trap-alert {
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--danger-bg);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      font-size: 0.84rem;
    }

    /* Part 2: Word Fill Bank */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
      border-radius: 12px;
      background: #0f1629;
      border: 1px dashed var(--border-color);
      margin-bottom: 20px;
    }
    .word-chip {
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 12px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .fill-item {
      margin-bottom: 16px;
      padding: 14px;
      background: #172238;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .fill-sentence { font-size: 0.95rem; line-height: 1.8; margin-bottom: 8px; }
    .fill-input {
      background: #0a0f1d;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      padding: 4px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.95rem;
      outline: none;
      min-width: 140px;
    }
    .fill-input.is-correct { border-color: var(--success); color: #6ee7b7; background: var(--success-bg); }
    .fill-input.is-wrong { border-color: var(--danger); color: #fda4af; background: var(--danger-bg); }
    .fill-trans { font-size: 0.88rem; color: var(--text-muted); font-style: italic; margin-bottom: 6px; }

    /* Part 3: Reading */
    .reading-passage {
      background: #0f172a;
      padding: 18px;
      border-radius: 12px;
      border-left: 4px solid var(--accent-indigo);
      margin-bottom: 20px;
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .reading-passage.vietnamese {
      border-left-color: #10b981;
      background: #11202f;
      display: none;
      margin-top: 10px;
    }
    .qa-item {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #162035;
      border: 1px solid var(--border-color);
    }
    .qa-q { font-weight: 700; color: #fff; margin-bottom: 4px; }
    .qa-q-vn { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .qa-ans {
      padding: 10px 12px;
      border-radius: 8px;
      background: #0c1424;
      border-left: 3px solid var(--success);
      font-size: 0.9rem;
      color: #e2e8f0;
      display: none;
    }
    .qa-ans.show { display: block; }

    /* Part 4: True/False */
    .tf-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      background: #172238;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .tf-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .tf-text { font-size: 0.94rem; color: #f1f5f9; flex: 1; }
    .tf-btns { display: flex; gap: 6px; }
    .tf-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0a0f1d;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tf-btn.selected-t { background: #0284c7; color: #fff; border-color: #0284c7; }
    .tf-btn.selected-f { background: #e11d48; color: #fff; border-color: #e11d48; }

    /* Part 5: Translate */
    .trans-item {
      margin-bottom: 16px;
      padding: 16px;
      background: #162238;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .trans-en { font-size: 0.96rem; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .trans-vn {
      padding: 10px 12px;
      background: #0d1527;
      border-left: 3px solid var(--accent-blue);
      border-radius: 6px;
      font-size: 0.92rem;
      color: #cbd5e1;
      display: none;
      margin-bottom: 6px;
    }
    .trans-vn.show { display: block; }
    .trans-notes { font-size: 0.85rem; color: #f59e0b; display: none; padding-top: 4px; }
    .trans-notes.show { display: block; }

    /* Common Buttons */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border-color: var(--border-color); }
    .btn-outline { background: transparent; color: var(--text-muted); border-color: var(--border-color); }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .score-badge {
      font-size: 0.92rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      background: #101827;
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
    }
    .extra-defs {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(10, 15, 29, 0.8);
      border: 1px dashed var(--border-color);
      font-size: 0.86rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Hệ Thống Thông Tin • E-Learning</div>
      <h1>Đề Ôn Luyện TACN HTTT (Test 1 → 5)</h1>
      <p class="subtitle">Đầy đủ 5 phần bài tập: Bảng Nối Thuật Ngữ 2 Cột, Điền Từ, Đọc Hiểu Song Ngữ, True/False & Dịch Câu</p>
    </header>

    <!-- 5 Test Selector Buttons -->
    <div class="test-nav">
      <button class="tab-btn active" onclick="switchMainTest(1)">TEST 1</button>
      <button class="tab-btn" onclick="switchMainTest(2)">TEST 2</button>
      <button class="tab-btn" onclick="switchMainTest(3)">TEST 3</button>
      <button class="tab-btn" onclick="switchMainTest(4)">TEST 4</button>
      <button class="tab-btn" onclick="switchMainTest(5)">TEST 5</button>
    </div>

    <!-- Container where tests render -->
    <div id="full-test-app"></div>
  </div>

  <script>
    // FULL DATA OF 5 TESTS FROM DOCUMENT
    const allTests = {
      1: {
        title: "Test 1: Networks, Databases & System Foundations",
        p1: {
          terms: [
            { id: 1, term: "Ports", ans: "f", exp: "Port = cổng kết nối. 'sockets' = ổ cắm; cổng là nơi cắm thiết bị ngoại vi vào máy.", trap: "Tránh nhầm với các kết nối logic/giao thức." },
            { id: 2, term: "Centralized Database", ans: "a", exp: "Dữ liệu lưu tập trung 1 chỗ, người dùng nhiều nơi cùng truy cập.", trap: "Bẫy: d là homogeneous distributed database (CSDL phân tán đồng nhất), KHÔNG phải centralized." },
            { id: 3, term: "Java applets", ans: "e", exp: "applet = chương trình nhỏ (small programs) tạo tệp tương tác.", trap: "Bẫy: c là CSS, dùng để thêm styles." },
            { id: 4, term: "Video conferencing", ans: "h", exp: "Hội nghị truyền hình = gọi video cho 1 hoặc nhiều người cùng lúc (2 chiều).", trap: "Bẫy: g là phát video broadcast 1 chiều lên internet." },
            { id: 5, term: "Background", ans: "b", exp: "Màu sắc, hoa văn nền của trang web (underlying colors and patterns).", trap: "Bẫy: c là stylesheet/CSS." }
          ],
          defs: [
            { key: "a", text: "a. The data is stored centrally and users from different locations can access this data." },
            { key: "b", text: "b. the underlying colors and patterns of a web page." },
            { key: "c", text: "c. a mechanism for adding styles to web documents." },
            { key: "d", text: "d. databases with the same base hardware and running on the same operating systems and applications." },
            { key: "e", text: "e. small programs that enable the creation of interactive files." },
            { key: "f", text: "f. sockets into which an external device may be connected." },
            { key: "g", text: "g. refers to a form of communication where videos are broadcast over the internet." },
            { key: "h", text: "h. refers to a set of technologies that allow a person to make a video call to one or more people at the same time." }
          ],
          extras: ["c: CSS (Cascading Style Sheets)", "d: Homogeneous distributed database", "g: Video broadcasting / Webcasting"]
        },
        p2: {
          words: ["machine", "digital", "analysis", "computers", "relational", "distributed", "exchange", "personal", "robotics", "wireless"],
          items: [
            { id: 1, text: "The {input} of large-size, unstructured information can be done very efficiently on several cloud virtual servers.", ans: "analysis", trans: "Việc phân tích thông tin có dung lượng lớn, phi cấu trúc có thể được thực hiện rất hiệu quả trên nhiều máy chủ ảo đám mây.", note: "Sau 'The' cần danh từ; 'analysis' = sự phân tích." },
            { id: 2, text: "A {input} database in which various parts of a database are located in different physical locations along with databases replicated and distributed between different points in a network can be imagined.", ans: "distributed", trans: "Có thể hình dung một cơ sở dữ liệu phân tán...", note: "Các phần CSDL nằm ở nhiều vị trí vật lý khác nhau = distributed database." },
            { id: 3, text: "Like human, a {input} retains information and becomes smarter over time.", ans: "machine", trans: "Giống như con người, một cỗ máy lưu giữ thông tin và trở nên thông minh hơn theo thời gian.", note: "Sau 'a' cần danh từ số ít (machine). 'computers' số nhiều là sai ngữ pháp." },
            { id: 4, text: "In the modern world, telecommunications mainly means transferring information across the Internet, via modem, phone lines or {input} networks.", ans: "wireless", trans: "Trong thế giới hiện đại, viễn thông chủ yếu có nghĩa là truyền thông tin...", note: "wireless networks = mạng không dây." },
            { id: 5, text: "In recent years, TV and radio broadcasting has been revolutionized by developments in satellite and {input} transmission.", ans: "digital", trans: "Truyền hình và phát thanh được cách mạng hóa nhờ truyền dẫn vệ tinh và kỹ thuật số.", note: "digital transmission = truyền dẫn kỹ thuật số." }
          ]
        },
        p3: {
          passage_en: "When a brand new computer comes off the factory assembly line, it can do nothing. The hardware needs software to make it work. Are we talking about applications software such as word-processing or spreadsheet software? Partly. But an applications software package does not communicate directly with the hardware. Between the applications software and the hardware is a software interface - an operating system. An operating system is a set of programs that lies between applications software and the computer hardware.\nThe most important program in the operating system, the program that manages the operating system, is the supervisor program, most of which remains in memory and is thus referred to as resident. The supervisor controls the entire operating system and loads into memory other operating system programs (called nonresident) from disk storage only as needed.\nAn operating system has three main functions: manage the computer's resources, such as the central processing unit, memory, disk drives, and printers, establish a user interface, and execute and provide services for applications software. Keep in mind, however, that much of the work of an operating system is hidden from the user. In particular, the first listed function, managing the computer's resources, is taken care of without the user being aware of the details. Furthermore, all input and output operations, although invoked by an applications program, are actually carried out by the operating system.",
          passage_vn: "Khi một chiếc máy tính mới tinh vừa ra khỏi dây chuyền lắp ráp của nhà máy, nó không thể làm được gì cả. Phần cứng cần có phần mềm để hoạt động. Giữa phần mềm ứng dụng và phần cứng là hệ điều hành - tập hợp các chương trình nằm giữa ứng dụng và phần cứng.\nChương trình quan trọng nhất là supervisor program (thường trú - resident trong bộ nhớ), điều khiển toàn bộ HĐH và nạp các chương trình nonresident từ đĩa khi cần.\nHệ điều hành có 3 chức năng chính: (1) quản lý tài nguyên máy tính (CPU, bộ nhớ, ổ đĩa, máy in); (2) thiết lập giao diện người dùng; (3) thực thi và cung cấp dịch vụ cho phần mềm ứng dụng. Tất cả thao tác nhập xuất dù do ứng dụng gọi nhưng thực tế do HĐH thực hiện.",
          qas: [
            { q: "1. Why does the hardware need software?", q_vn: "Tại sao phần cứng cần phần mềm?", a: "Because a brand new computer can do nothing by itself; the hardware needs software to make it work." },
            { q: "2. Why is the supervisor program considered as the most important operating system program?", q_vn: "Tại sao supervisor program là quan trọng nhất?", a: "Because it manages and controls the entire operating system, and it loads other operating system programs into memory from disk when they are needed." },
            { q: "3. What is the difference between resident and non-resident programs?", q_vn: "Sự khác nhau giữa chương trình resident và non-resident?", a: "Resident programs (supervisor) stay in memory all the time, while non-resident programs are kept on disk storage and are loaded into memory only when needed." },
            { q: "4. What are the main functions of an operating system?", q_vn: "Các chức năng chính của hệ điều hành là gì?", a: "It has three main functions: (1) manage the computer's resources (CPU, memory, disk drives, printers); (2) establish a user interface; (3) execute and provide services for applications software." },
            { q: "5. Are computer's input and output operations carried out by the applications software?", q_vn: "Các thao tác I/O có do phần mềm ứng dụng thực hiện không?", a: "No, they aren't. They are invoked by an applications program, but they are actually carried out by the operating system." }
          ]
        },
        p4: [
          { id: 1, text: "A database query function allows you to extract information according to certain conditions or criteria.", ans: true, exp: "Query = truy vấn: trích xuất thông tin theo điều kiện hoặc tiêu chí nhất định." },
          { id: 2, text: "Centralized Database are the paid versions of the enormous databases, designed for users who wish to access the information for assistance.", ans: false, exp: "Sai. Centralized database là CSDL tập trung, không phải 'bản trả phí'." },
          { id: 3, text: "The analysis of large-size, unstructured information can be done very efficiently on every cloud virtual servers.", ans: false, exp: "Sai ở chữ 'every' (câu gốc trong bài là 'on several cloud virtual servers')." },
          { id: 4, text: "Vlogging and Blogging are similar in delivering informal styles, however, with Vlogging, Vloggers can post videos.", ans: true, exp: "Đúng. Vlogging đăng video, Blogging chủ yếu là chữ." },
          { id: 5, text: "Hackers are always looking to exploit a private network or system's vulnerabilities so they can steal confidential information and data.", ans: true, exp: "Đúng. Hacker luôn tìm cách khai thác lỗ hổng (vulnerabilities) để đánh cắp dữ liệu." }
        ],
        p5: [

        p3: {
          passage_en: "Information stored in the RAM is lost when the computer is turned off. Because of this, data and applications are stored in either hard or floppy disks which provide a more permanent backing store.\nFloppy disks are so called because they consist of flexible plastic material which has a magnetizable surface. They are available in two sizes: 5.25-inch disks are used in old computers, 3.5-inch disks are the most popular today. The surface of a floppy disk is divided into concentric circles or 'tracks', which are then divided into 'sectors'. When you insert a blank disk into a disk drive, it must be 'initialized', or formatted, before information can be recorded onto it. This means that magnetic areas are created for each track and sector, along with a catalogue or 'directory' which will record the specific location of files.\nWhen you save a file, the operating system moves the read/write heads of the disk drive towards empty sectors, records the data and writes an entry for the directory. Later on, when you open that file, the operating system looks for its entry in the directory on the disk, moves the read/write heads to the correct sectors, and reads the file into the RAM area.",
          passage_vn: "Thông tin trong RAM bị mất khi tắt máy. Do đó, dữ liệu lưu trên đĩa cứng hoặc đĩa mềm để lưu trữ vĩnh viễn hơn.\nĐĩa mềm làm từ vật liệu nhựa dẻo nhiễm từ, gồm 2 cỡ: 5.25 inch (máy tính cũ) và 3.5 inch (phổ biến nhất hiện nay). Bề mặt đĩa chia thành các vòng tròn đồng tâm (tracks), chia tiếp thành các cung (sectors). Khi đưa đĩa trống vào ổ, nó phải được định dạng (initialized/formatted).\nKhi lưu file, HĐH di chuyển đầu đọc/ghi tới cung trống, ghi dữ liệu và ghi mục vào thư mục (directory).",

        p3: {
          passage_en: "The ability of tiny computing devices to control complex operations has transformed the way many tasks are performed, ranging from scientific research to producing consumer products. Tiny 'computers on a chip' are used in medical equipment, home appliances, cars and toys. Workers use handheld computing devices to collect data at a customer site, to generate forms, to control inventory, and to serve as desktop organizers.\nNot only is computing equipment getting smaller, it is getting more sophisticated. Computers are part of many machines and devices that once required continual human supervision and control. Today, computers in security systems result in safer environments, computers in cars improve energy efficiency, and computers in phones provide features such as call forwarding, call monitoring, and call answering.\nThese smart machines are designated to take over some of the basic tasks previously performed by people; by so doing, they make life a little easier and a little more pleasant. Smart cards store vital information such as health records, drivers’ licenses, bank balances, and so on. Smart phones, cars, and appliances with built in computers can be programmed to better meet individual needs. A smart house has a built-in monitoring system that can turn lights on and off, open and close windows, operate the oven, and more.\nWith small computing devices available for performing smart tasks like cooking dinner, programming the VCR, and controlling the flow of information in an organization, people are able to spend more time doing what they often do best – being creative. Computers can help people work more creatively.",

        p3: {
          passage_en: "Unfortunately, computers cannot understand ordinary spoken English or any other natural language. The only language they can understand directly is called machine code. This consists of the 1s and 0s (binary code) that are processed by the CPU. However, machine code as a means of communication is very difficult to write. For this reason, we use symbolic languages that are easier to understand. Then, by using a special program, these languages can be translated into machine code. For example, the so-called assembly languages use abbreviations such as ADD, SUB, MPY to represent instructions. These mnemonic codes are likes labels easily associated with the items to which they refer.\nBasic languages, where the program is similar to the machine code version, are known as low-level languages. In these languages, each instruction is equivalent to a single machine code instruction, and the program is converted into machine code by a special program called an assembler. These languages are still quite complex and restricted to particular machines.\nTo make the programs easier to write and overcome the problem of intercommunication between different types of machines, higher-level languages were designed such as BASIC, COBOL, FORTRAN, or Pascal. These are all problem-oriented rather than machine-oriented. Programs written in one of these languages (known as source programs) are converted into a lower-level language by means of a compiler (generating the object program). On compilation, each statement in a high-level language is generally translated into many machine code instructions.",

        p3: {
          passage_en: "A biological virus is a very small, simple organism that infects living cells, known as the host, by attaching itself to them and using them to reproduce itself. This often causes harm to the host cells.\nSimilarly, a computer virus is a very small program routine that infects a computer system and uses its resources to reproduce itself. It often does this by patching the operating system to enable it to detect program files, such as COM or EXE files. It then copies itself into those files. This sometimes causes harm to the host computer system. When the user runs an infected program, it is loaded into memory carrying the virus. The virus uses a common programming technique to stay resident in memory. It can then use a reproduction routine to infect other programs. This process continues until the computer is switched off.\nThe virus may also contain a payload that remains dormant until a trigger event activates it, such as the user pressing a particular key. The payload can have a variety of forms. It might do something relatively harmless such as displaying a message on the monitor screen or it might do something more destructive such as deleting files on the hard disk.\nWhen it infects a file, the virus replaces the first instruction in the host program with a command that changes the normal execution sequence. This type of command is known as JUMP command and causes the virus instructions to be executed before the host program. The virus then returns control to the host program which then continues with its normal sequence of instructions and is executed in the normal way.",

          `;
        });
        let p1Extras = test.p1.extras.map(e => `<div>• ${e}</div>`).join("");

        let p1Html = `
          <div class="card part-section active" id="sec-${t}-1">
            <div class="card-header">
              <div class="card-title">Phần I: Match the terms (A) with definitions (B)</div>
              <div class="score-badge" id="p1-score-${t}">Chưa nộp bài</div>
            </div>
            <div class="matching-table-wrap">
              <table class="matching-table">
                <thead><tr><th>Cột A: Thuật ngữ</th><th>Cột B: Chọn định nghĩa tương ứng</th></tr></thead>
                <tbody>${p1Rows}</tbody>
              </table>
            </div>
            <div class="action-row">
              <div class="btn-group">
                <button class="btn btn-primary" onclick="checkP1(${t})">Chấm Điểm Nối Từ</button>
                <button class="btn btn-secondary" onclick="toggleExpP1(${t})">Hiện / Ẩn Giải Thích & Bẫy</button>
                <button class="btn btn-outline" onclick="resetP1(${t})">Làm Lại</button>
              </div>
            </div>
            <div class="extra-defs">
              <strong style="color: var(--warning);">3 định nghĩa dư thừa trong đề để gài bẫy:</strong>
              ${p1Extras}
            </div>
          </div>
        `;

        // PART 2: Fill in the blank
        let wordsChips = test.p2.words.map(w => `<span class="word-chip">${w}</span>`).join("");
        let p2Items = "";
        test.p2.items.forEach(item => {
          let s = item.text.replace("{input}", `<input type="text" class="fill-input p2-input-${t}" data-ans="${item.ans.toLowerCase()}" placeholder="..." />`);
          p2Items += `
            <div class="fill-item">
              <div class="fill-sentence"><strong>${item.id}.</strong> ${s}</div>
              <div class="fill-trans">→ Dịch: ${item.trans}</div>
              <div class="exp-box" id="p2-exp-${t}-${item.id}">
                <strong>Đáp án: ${item.ans}</strong> | Phân tích: ${item.note}
              </div>
            </div>
          `;
        });

        let p2Html = `
          <div class="card part-section" id="sec-${t}-2">
            <div class="card-header">
              <div class="card-title">Phần II: Choose suitable word(s) to fill in the blank</div>
              <div class="score-badge" id="p2-score-${t}">Chưa nộp bài</div>
            </div>
            <div class="word-bank">${wordsChips}</div>
            <div>${p2Items}</div>
            <div class="action-row">
              <div class="btn-group">
                <button class="btn btn-primary" onclick="checkP2(${t})">Kiểm Tra Điền Từ</button>
                <button class="btn btn-secondary" onclick="toggleExpP2(${t})">Xem Giải Thích Chi Tiết</button>
              </div>
            </div>
          </div>
        `;

        // PART 3: Reading Passage & QA
        let qaItems = "";
        test.p3.qas.forEach((qa, idx) => {
          qaItems += `
            <div class="qa-item">
              <div class="qa-q">${qa.q}</div>
              <div class="qa-q-vn">${qa.q_vn}</div>
              <div class="qa-ans p3-ans-${t}">${qa.a}</div>
            </div>
          `;
        });

        let p3Html = `
          <div class="card part-section" id="sec-${t}-3">
            <div class="card-header">
              <div class="card-title">Phần III: Reading Comprehension & Q&A</div>
              <button class="btn btn-outline" onclick="toggleVNPassage(${t})">Dịch Đoạn Văn Sang Tiếng Việt</button>
            </div>
            <div class="reading-passage">${test.p3.passage_en.replace(/\n/g, '<br><br>')}</div>
            <div class="reading-passage vietnamese" id="passage-vn-${t}">${test.p3.passage_vn.replace(/\n/g, '<br><br>')}</div>
            <div>${qaItems}</div>
            <div class="action-row">
              <div class="btn-group">
                <button class="btn btn-primary" onclick="toggleAnswersP3(${t})">Hiện / Ẩn Câu Trả Lời & Dẫn Chứng</button>
              </div>
            </div>
          </div>
        `;

        // PART 4: True / False
        let tfItems = "";
        test.p4.forEach(item => {
          tfItems += `
            <div class="tf-item">
              <div class="tf-header">
                <div class="tf-text"><strong>${item.id}.</strong> ${item.text}</div>
                <div class="tf-btns">
                  <button class="tf-btn tf-btn-${t}" data-id="${item.id}" data-val="true" onclick="selectTF(${t}, ${item.id}, true)">True</button>
                  <button class="tf-btn tf-btn-${t}" data-id="${item.id}" data-val="false" onclick="selectTF(${t}, ${item.id}, false)">False</button>
                </div>
              </div>
              <div class="exp-box" id="p4-exp-${t}-${item.id}">
                <strong>Đáp án: ${item.ans ? 'TRUE (Đúng)' : 'FALSE (Sai)'}</strong> - ${item.exp}
              </div>
            </div>
          `;
        });

        let p4Html = `
          <div class="card part-section" id="sec-${t}-4">
            <div class="card-header">
              <div class="card-title">Phần IV: Decide True (T) or False (F)</div>
              <div class="score-badge" id="p4-score-${t}">Chưa nộp bài</div>
            </div>
            <div>${tfItems}</div>
            <div class="action-row">
              <div class="btn-group">
                <button class="btn btn-primary" onclick="checkP4(${t})">Chấm Điểm True/False</button>
                <button class="btn btn-secondary" onclick="toggleExpP4(${t})">Xem Điểm Bẫy Đề Thi</button>
              </div>
            </div>
          </div>
        `;

        // PART 5: Translation
        let transItems = "";
        test.p5.forEach((item, idx) => {
          transItems += `
            <div class="trans-item">
              <div class="trans-en">${item.en}</div>
              <div class="trans-vn p5-vn-${t}">${item.vn}</div>
              <div class="trans-notes p5-note-${t}">📌 Lưu ý cấu trúc: ${item.notes}</div>
            </div>
          `;
        });

        let p5Html = `
          <div class="card part-section" id="sec-${t}-5">
            <div class="card-header">
              <div class="card-title">Phần V: Translate into Vietnamese & Grammar Notes</div>
            </div>
            <div>${transItems}</div>
            <div class="action-row">
              <div class="btn-group">
                <button class="btn btn-primary" onclick="toggleP5(${t})">Hiện / Ẩn Bản Dịch Tiếng Việt & Lưu Ý Cấu Trúc</button>
              </div>
            </div>
          </div>
        `;

        testWrap.innerHTML = partNavHtml + p1Html + p2Html + p3Html + p4Html + p5Html;
        app.appendChild(testWrap);
      }
    }

    // Switch between Test 1 -> 5
    function switchMainTest(testNum) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === testNum);
      });
      document.querySelectorAll('.test-content').forEach(tc => {
        tc.classList.remove('active');
      });
      const cur = document.getElementById(`test-wrapper-${testNum}`);
      if (cur) cur.classList.add('active');
    }

    // Switch between Part 1 -> 5
    function switchPart(testNum, partNum) {
      const wrapper = document.getElementById(`test-wrapper-${testNum}`);
      wrapper.querySelectorAll('.part-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx + 1 === partNum);
      });
      wrapper.querySelectorAll('.part-section').forEach(s => {
        s.classList.remove('active');
      });
      const sec = document.getElementById(`sec-${testNum}-${partNum}`);
      if (sec) sec.classList.add('active');
    }

    // P1 Checking & Logic
    function checkP1(testNum) {
      const selects = document.querySelectorAll(`.p1-select-${testNum}`);
      let correct = 0;
      selects.forEach(s => {
        const user = s.value.trim().toLowerCase();
        const ans = s.dataset.ans.toLowerCase();
        const tid = s.dataset.id;
        const box = document.getElementById(`p1-exp-${testNum}-${tid}`);
        if (user === ans) {
          correct++;
          s.classList.remove('is-wrong');
          s.classList.add('is-correct');
        } else {
          s.classList.remove('is-correct');
          s.classList.add('is-wrong');
          if (box) box.classList.add('show');
        }
      });
      const badge = document.getElementById(`p1-score-${testNum}`);
      badge.textContent = `Đúng ${correct}/${selects.length} câu (${Math.round(correct/selects.length*100)}%)`;
    }
    function toggleExpP1(testNum) {
      const boxes = document.querySelectorAll(`#sec-${testNum}-1 .exp-box`);
      let anyHide = Array.from(boxes).some(b => !b.classList.contains('show'));
      boxes.forEach(b => b.classList.toggle('show', anyHide));
    }
    function resetP1(testNum) {
      document.querySelectorAll(`.p1-select-${testNum}`).forEach(s => {
        s.value = "";
        s.classList.remove('is-correct', 'is-wrong');
      });
      document.querySelectorAll(`#sec-${testNum}-1 .exp-box`).forEach(b => b.classList.remove('show'));
      document.getElementById(`p1-score-${testNum}`).textContent = "Chưa nộp bài";
    }

    // P2 Checking
    function checkP2(testNum) {
      const inputs = document.querySelectorAll(`.p2-input-${testNum}`);
      let correct = 0;
      inputs.forEach(inp => {
        const val = inp.value.trim().toLowerCase();
        const ans = inp.dataset.ans.toLowerCase();
        if (val === ans) {
          correct++;
          inp.classList.remove('is-wrong');
          inp.classList.add('is-correct');
        } else {
          inp.classList.remove('is-correct');
          inp.classList.add('is-wrong');
        }
      });
      const badge = document.getElementById(`p2-score-${testNum}`);
      badge.textContent = `Đúng ${correct}/${inputs.length} câu`;
      toggleExpP2(testNum, true);
    }
    function toggleExpP2(testNum, forceShow) {
      const boxes = document.querySelectorAll(`#sec-${testNum}-2 .exp-box`);
      let show = forceShow !== undefined ? forceShow : Array.from(boxes).some(b => !b.classList.contains('show'));
      boxes.forEach(b => b.classList.toggle('show', show));
    }

    // P3 Reading
    function toggleVNPassage(testNum) {
      const vnP = document.getElementById(`passage-vn-${testNum}`);
      vnP.style.display = vnP.style.display === 'block' ? 'none' : 'block';
    }
    function toggleAnswersP3(testNum) {
      const ansList = document.querySelectorAll(`.p3-ans-${testNum}`);
      let anyHide = Array.from(ansList).some(a => !a.classList.contains('show'));
      ansList.forEach(a => a.classList.toggle('show', anyHide));
    }

    // P4 True False
    const userTF = {};
    function selectTF(testNum, id, val) {
      if (!userTF[testNum]) userTF[testNum] = {};
      userTF[testNum][id] = val;
      const rowBtns = document.querySelectorAll(`.tf-btn-${testNum}[data-id="${id}"]`);
      rowBtns.forEach(btn => {
        const bVal = btn.dataset.val === 'true';
        btn.classList.remove('selected-t', 'selected-f');
        if (bVal === val) {
          btn.classList.add(val ? 'selected-t' : 'selected-f');
        }
      });
    }
    function checkP4(testNum) {
      const tests = allTests[testNum].p4;
      let correct = 0;
      tests.forEach(item => {
        const userChoice = userTF[testNum] ? userTF[testNum][item.id] : undefined;
        const box = document.getElementById(`p4-exp-${testNum}-${item.id}`);
        if (userChoice === item.ans) {
          correct++;
        } else {
          if (box) box.classList.add('show');
        }
      });
      const badge = document.getElementById(`p4-score-${testNum}`);
      badge.textContent = `Đúng ${correct}/${tests.length} câu`;
    }
    function toggleExpP4(testNum) {
      const boxes = document.querySelectorAll(`#sec-${testNum}-4 .exp-box`);
      let anyHide = Array.from(boxes).some(b => !b.classList.contains('show'));
      boxes.forEach(b => b.classList.toggle('show', anyHide));
    }

    // P5 Translation
    function toggleP5(testNum) {
      const vns = document.querySelectorAll(`.p5-vn-${testNum}`);
      const notes = document.querySelectorAll(`.p5-note-${testNum}`);
      let anyHide = Array.from(vns).some(v => !v.classList.contains('show'));
      vns.forEach(v => v.classList.toggle('show', anyHide));
      notes.forEach(n => n.classList.toggle('show', anyHide));
    }

    document.addEventListener("DOMContentLoaded", renderApp);
  </script>
</body>
</html>
